<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'">
  <title>小余额</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="petRoot" class="pet-root" aria-label="小余额桌宠">
    <section id="bubble" class="bubble" aria-live="polite">
      <div class="bubble-tail tail-one"></div>
      <div class="bubble-tail tail-two"></div>
      <div id="bubbleContent" class="bubble-content">
        <div id="label" class="bubble-label">账户余额</div>
        <div id="amount" class="bubble-amount">--</div>
        <div id="hint" class="bubble-hint">点击刷新</div>
      </div>
    </section>

    <div id="petBody" class="pet-body" role="button" tabindex="0" aria-label="刷新余额并打开气泡">
      <img id="petImage" class="pet-image" src="../assets/pet.png" alt="小余额">
      <span id="statusDot" class="status-dot status-idle"></span>
      <button id="menuButton" class="icon-button menu-button" type="button" title="设置" aria-label="设置">
        <span></span><span></span><span></span>
      </button>
    </div>

    <section id="settingsPanel" class="settings-panel" aria-hidden="true">
      <header>
        <div>
          <h1>小余额</h1>
          <p>中转站余额监控</p>
        </div>
        <button id="closeSettings" class="icon-button close-button" type="button" title="关闭设置" aria-label="关闭设置">×</button>
      </header>
      <form id="settingsForm">
        <label>余额 API 地址<input id="endpoint" type="url" placeholder="https://example.com/api/balance" required></label>
        <div class="form-row">
          <label>认证方式<select id="authMode"><option value="bearer">Bearer Token（只填令牌）</option><option value="authorization">完整 Authorization（需含 Bearer）</option><option value="websee-session">中转站会话（websee-session）</option><option value="x-api-key">x-api-key</option><option value="custom">自定义 Header</option></select></label>
          <label id="headerField">Header 名<input id="headerName" type="text" value="Authorization"></label>
        </div>
        <div class="form-row">
          <label>宠物形象<select id="petStyle"><option value="deepseek">DeepSeek 小鲸鱼</option><option value="chatgpt">ChatGPT 小龙</option></select></label>
          <label>交互模式<select id="interactionMode"><option value="free">自由拖动</option><option value="locked">锁定互动</option></select></label>
        </div>
        <label>访问令牌<input id="token" type="password" autocomplete="off" placeholder="留空则保持现有令牌"></label>
        <div class="form-row">
          <label>余额 JSON 路径<input id="balancePath" type="text" placeholder="data.balance"></label>
          <label>货币<input id="currency" type="text" maxlength="8" placeholder="USD"></label>
        </div>
        <div class="form-row">
          <label>刷新秒数<input id="refreshSeconds" type="number" min="30" max="86400"></label>
          <label>低余额阈值<input id="lowThreshold" type="number" step="0.01"></label>
        </div>
        <div class="range-row"><span>大小</span><input id="scale" type="range" min="0.75" max="1.25" step="0.05"><output id="scaleValue"></output></div>
        <div class="range-row"><span>音量</span><input id="volume" type="range" min="0" max="1" step="0.05"><output id="volumeValue"></output></div>
        <div class="toggle-row"><label><input id="sound" type="checkbox"> 按压音效</label><label><input id="bubbleEnabled" type="checkbox"> 对话气泡</label></div>
        <p id="formMessage" class="form-message"></p>
        <button class="primary-button" type="submit">保存并测试</button>
      </form>
    </section>
  </main>
  <audio id="pressSound" src="../assets/press.mp3" preload="auto"></audio>
  <audio id="releaseSound" src="../assets/release.mp3" preload="auto"></audio>
  <script src="renderer.js"></script>
</body>
</html>
